[build]
command = "npm run build"
publish = "dist"
[build.environment]
NODE_VERSION = "24"
[server]
path = "/api/*"
[[redirects]]
from = "/app/*"
to = "/index.html"
status = 200
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
